# OBSBOT Meet SE (3564:fefe).
#
# Partly verified (firmware 4.6.4.1, OBSBOT Center usbmon captures): Auto
# Framing, Field of View, waking from sleep, HDR, mirror image, the audio
# settings, sleep time and the status light, see below. Everything else is
# unverified and deliberately partial. Non-gimbal bindings below are copied
# from tiny-se.toml: OBSBOT's own SDK (bundled in
# https://github.com/aaronsb/obsbot-camera-control) groups Meet SE with
# Tiny, Tiny 4K, Tiny 2 (+ Lite) and Tiny SE under one status-block struct
# internally (a *different* struct than plain Meet/Meet 4K use), and
# cgevans/tiny2's independent reverse-engineering of the Tiny 2 confirms
# several of the same command/tag IDs as the Tiny SE captures this project
# has (see tiny-2.toml). But the Meet line doesn't have the Tiny line's
# mechanical gimbal, so gimbal velocity, presets and gimbal reset/reverse
# are deliberately left unbound here rather than guessed -- everything
# else is still an assumption pending real captures. If you can capture
# this model's traffic, please correct this file and drop this notice; see
# "Adding support for another camera" in README.md.
#
# Image controls and focus are standard UVC controls (inherited from
# generic-uvc). AI and gesture features use the vendor protocol on
# Extension Unit 2 -- see docs/protocol.md.
#
# Vendor bindings:
#   frames = framed commands on selector 2 (dst module, 2-byte cmd, value encoding)
#   short  = short setting on selector 6: [id, len, value]
#   status = byte offset in the selector 6 status block used for readback

id = "meet-se"
name = "OBSBOT Meet SE"
inherits = "generic-uvc"

# Firmware version and serial number via system module queries.
system_info = true

[[match]]
vendor_id = 0x3564
product_id = 0xfefe

# Standard control overrides. The Tiny SE's exposure_auto menu is
# 0 = Auto Mode, 1 = Manual (not the usual 3 = Aperture Priority).
[features.auto_exposure]
v4l2 = 0x009a0901
map = [[1, 0], [0, 1]]

[features.mirror_image]
status = 19
short = { id = 0x14 }

# Manual zoom: ISP digital zoom, factor x100 (100..400) after a constant
# 02000000 (the same command the gesture zoom factor sends). Query 0468
# returns the current zoom as f32, including zoom from AI tracking.
[features.zoom]
query = { dst = 0x04, cmd = "0468", offsets = [0], value = "f32", scale = 100 }
frames = [{ dst = 0x02, cmd = "4219", prefix = "02000000", value = "u32" }]

# 0 off, 1 group, 2 human, 3 hand tracking
[features.ai_mode]
status = 24
short = { id = 0x16, value = "u16" }

# Sleep/resume: ISP u32, 1 sleep, 0 wake. Meet SE: status[9] is 1 awake and
# 3 asleep (status[2] stays 0); waking verified from Linux, sleeping not.
[features.sleep]
status = 9
status_mask = 0x02
frames = [{ dst = 0x02, cmd = "c2a0", value = "u32" }]

# OBSBOT Center's AI lock is host-side: it turns AI tracking and gestures
# off, and unlocking restores the AI mode (not the gestures).
[features.ai_lock]
lock = { off = ["ai_mode", "auto_framing"], restore = ["ai_mode"] }

# Image
[features.hdr]
status = 6
short = { id = 0x01 }

# 0 Global, 1 Face
[features.auto_focus_mode]
status = 13
frames = [{ dst = 0x02, cmd = "0236", value = "u32" }]

# 0 Global, 1 Face
[features.auto_exposure_mode]
status = 7
short = { id = 0x03 }

# UVC backlight compensation 0..18 is -3..+3 EV in 1/3 steps.
[features.exposure_compensation]
v4l2 = 0x0098091c
offset = 9
scale = 3

# Audio. Mic during sleep, Noise Reduction (0 Off, 1 Weak, 2 Medium,
# 3 Strong) and Radio Distance (0 Close, 1 Standard, 2 Far) match OBSBOT
# Center captures, status bytes included. Auto Gain and Disable Microphone
# were written and read back from Linux; disabling the microphone drops the
# camera's USB audio interface, enabling it brings it back.
[features.mic_during_sleep]
status = 16
short = { id = 0x13 }

[features.noise_reduction]
status = 8
short = { id = 0x0a }

[features.auto_gain]
status = 25
short = { id = 0x17 }

# The camera value is 1 while the microphone is enabled; with 0 it
# re-enumerates on USB without its audio interface.
[features.disable_microphone]
status = 34
status_mask = 0x10
short = { id = 0x1c }
invert = true

[features.pickup_distance]
status = 34
status_mask = 0x0f
short = { id = 0x1b }

# Device sleep: one i16 setting in seconds, negated while auto sleep is off.
[features.auto_sleep]
status = 10
status_value = "i16"
short = { id = 0x0b, value = "u16" }
level = "sign-switch"
default_level = 30

[features.sleep_time]
status = 10
status_value = "i16"
short = { id = 0x0b, value = "u16" }
level = "magnitude"
default_level = 30

[features.sleep_background_mirror]
status = 29
short = { id = 0x0e, prefix = "02" }

# Auto Framing (the palm-up gesture, "Enter/Exit Auto Frame"), its
# Composition Mode, and the gesture Zoom with its Zoom Factor are ONE short
# setting, `20 05 [on] [mode] [zoom on] [factor x100, u16 LE]`, seen in
# OBSBOT Center usbmon captures (firmware 4.6.4.1); each field written and
# read back from Linux. The camera reports the same record in the status
# word at offset 38 (u16 LE): bit 0 on, bits 1-2 mode, bit 3 zoom on, bits
# 4-15 factor x100, so a write reads the word, changes one field and sends
# the whole record (`packed`). Mode: 0 Group Mode, 1 Single Close-up, 2
# Upper Body. The Tiny SE gesture switches (Locked Target, the master switch,
# Dynamic Zoom, Direction Flip) are not bound: Locked Target and the master
# switch did not stop the palm gesture here, and the app has no such controls.
[features.auto_framing]
short = { id = 0x20, packed = [[0, 1], [1, 2], [3, 1], [4, 12]] }
status = 38
status_value = "u16"
status_bits = [0, 1]

[features.composition_mode]
short = { id = 0x20, packed = [[0, 1], [1, 2], [3, 1], [4, 12]] }
status = 38
status_value = "u16"
status_bits = [1, 2]

[features.gesture_zoom]
short = { id = 0x20, packed = [[0, 1], [1, 2], [3, 1], [4, 12]] }
status = 38
status_value = "u16"
status_bits = [3, 1]

# 100..400 (1.00x..4.00x)
[features.gesture_zoom_factor]
short = { id = 0x20, packed = [[0, 1], [1, 2], [3, 1], [4, 12]] }
status = 38
status_value = "u16"
status_bits = [4, 12]

# Field of View: short setting `04 01 [0|1|2]`; readback status byte 4 & 3
# (bit 2 is set while a digital zoom/crop is active). 0 Wide, 1 Medium,
# 2 Narrow, checked against the picture from Linux. Medium and Narrow
# correspond to 1.25x and 1.5x in the app. The camera ignores the write
# while it sleeps. The digital crop window itself is short setting `21 10`,
# four u32 [x0, y0, x1, y1] in 1/10000 of the frame (a 2.5x zoom is 4000
# wide); it is not bound.
[features.fov]
short = { id = 0x04 }
status = 4
status_mask = 0x03

# Status light: 0 off, 1..3 brightness.
[features.status_light]
status = 33
short = { id = 0x1a }
level = "switch"
default_level = 2

[features.status_light_brightness]
status = 33
short = { id = 0x1a }
level = "magnitude"
default_level = 2
